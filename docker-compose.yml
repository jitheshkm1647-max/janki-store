# Local PostgreSQL and Redis for Janki Design development.
#   npm run db:up     start both (data is kept in Docker volumes)
#   npm run db:down   stop them
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: janki
    ports:
      - "5432:5432"
    volumes:
      - janki-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d janki"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - janki-redis:/data

volumes:
  janki-postgres:
  janki-redis:
